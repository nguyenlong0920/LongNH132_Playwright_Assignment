name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Prepare auth directory
        run: |
          mkdir -p playwright/.auth
          ls -ld playwright/.auth

      - name: Run auth setup
        run: npx playwright test --project=setup

      - name: Verify auth state
        run: |
          echo "Auth files:"
          ls -lah playwright/.auth

          test -s playwright/.auth/chromium.json
          test -s playwright/.auth/firefox.json
          test -s playwright/.auth/webkit.json

      - name: Run Playwright tests
        run: npx playwright test --project=chromium --project=firefox --project=webkit --no-deps

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30